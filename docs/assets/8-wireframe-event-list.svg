<svg width="360" height="600" viewBox="0 0 360 600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- 배경 (모바일 화면 프레임) -->
  <rect x="0" y="0" width="360" height="600" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- 상단 헤더: 로고 + 포인트 배지 (UC-4) -->
  <rect x="0" y="0" width="360" height="64" fill="#f5f5f5" stroke="#333333" stroke-width="1"/>
  <text x="16" y="38" font-size="20" font-weight="bold" fill="#222222">freshmeal</text>
  <rect x="240" y="16" width="104" height="32" rx="16" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="292" y="37" font-size="13" fill="#222222" text-anchor="middle">1,500 P</text>

  <!-- 카드 1: 진행중 -->
  <g>
    <rect x="16" y="84" width="328" height="88" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="32" y="100" width="56" height="22" rx="4" fill="#333333"/>
    <text x="60" y="115" font-size="11" fill="#ffffff" text-anchor="middle">진행중</text>
    <text x="96" y="116" font-size="15" fill="#222222">여름 특가 이벤트</text>
    <text x="32" y="144" font-size="12" fill="#666666">07.01 ~ 08.31</text>
    <text x="320" y="144" font-size="16" fill="#999999" text-anchor="middle">&gt;</text>
  </g>

  <!-- 카드 2: 예정 -->
  <g>
    <rect x="16" y="184" width="328" height="88" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="32" y="200" width="56" height="22" rx="4" fill="#999999"/>
    <text x="60" y="215" font-size="11" fill="#ffffff" text-anchor="middle">예정</text>
    <text x="96" y="216" font-size="15" fill="#222222">가을 신메뉴 이벤트</text>
    <text x="32" y="244" font-size="12" fill="#666666">09.01 ~ 09.30</text>
    <text x="320" y="244" font-size="16" fill="#999999" text-anchor="middle">&gt;</text>
  </g>

  <!-- 카드 3: 진행중 -->
  <g>
    <rect x="16" y="284" width="328" height="88" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <rect x="32" y="300" width="56" height="22" rx="4" fill="#333333"/>
    <text x="60" y="315" font-size="11" fill="#ffffff" text-anchor="middle">진행중</text>
    <text x="96" y="316" font-size="15" fill="#222222">재구매 포인트 2배</text>
    <text x="32" y="344" font-size="12" fill="#666666">08.01 ~ 08.20</text>
    <text x="320" y="344" font-size="16" fill="#999999" text-anchor="middle">&gt;</text>
  </g>

  <!-- 안내: 종료 이벤트는 목록에서 제외 (UC-2 3.3-1) -->
  <text x="180" y="410" font-size="11" fill="#aaaaaa" text-anchor="middle">(종료된 이벤트는 이 목록에서 제외됩니다)</text>

  <!-- 하단 고정 메뉴: 내 응모 내역 (UC-8 진입) -->
  <rect x="0" y="536" width="360" height="64" fill="#f5f5f5" stroke="#333333" stroke-width="1"/>
  <rect x="16" y="552" width="328" height="32" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
  <text x="180" y="573" font-size="13" fill="#222222" text-anchor="middle">내 응모 내역</text>

  <!-- 캡션 -->
  <text x="180" y="20" font-size="0" fill="none">이벤트 목록 (UC-2, UC-4) - 모바일 뷰</text>
</svg>
